<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Page</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{font-family:'Inter',sans-serif;}</style></head><body id="main-body" class="bg-gray-50"><main id="content-container" class="container mx-auto px-6 py-12 max-w-4xl"></main><script>fetch('data.json').then(r=>r.json()).then(data=>{const c=document.getElementById('content-container');const b=document.getElementById('main-body');if(data.modules){data.modules.forEach(m=>{if(m.type==='header'){c.innerHTML+=`<h1 class="text-4xl font-bold text-gray-900 mt-8 mb-4">${m.content||''}</h1>`;}else if(m.type==='body'){c.innerHTML+=`<p class="text-gray-700 text-lg leading-relaxed mb-6 whitespace-pre-wrap">${m.content||''}</p>`;}else if(m.type==='image'){c.innerHTML+=`<img src="${m.url}" class="w-full h-auto rounded-xl shadow-lg my-8 object-cover">`;}else if(m.type==='background'){if(m.bgType==='color'){b.style.backgroundColor=m.value;}else if(m.bgType==='image'){b.style.backgroundImage=`url('${m.value}')`;b.style.backgroundSize='cover';b.style.backgroundAttachment='fixed';b.style.backgroundPosition='center';}}});}}).catch(e=>console.error(e));</script></body></html>

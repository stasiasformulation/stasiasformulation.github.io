<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Page</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{font-family:'Inter',sans-serif; transition: background 0.3s;}</style></head><body id="main-body" class="bg-gray-50"><main id="content-container" class="pb-12"></main><script>const getData=()=>window.CMS_PREVIEW_DATA?Promise.resolve(window.CMS_PREVIEW_DATA):fetch('data.json').then(r=>r.json());getData().then(data=>{if(data.settings){document.title=data.settings.tabTitle||'Page';if(data.settings.favicon){let l=document.createElement('link');l.rel='icon';l.href=data.settings.favicon;document.head.appendChild(l);}}const c=document.getElementById('content-container');const b=document.getElementById('main-body');let html='';if(data.modules){data.modules.forEach(m=>{if(m.type==='header'){html+=`<div class="container mx-auto px-6 max-w-4xl"><h1 style="font-family: '${m.font}'; color: ${m.textColor}; font-size: ${m.textSize}px;" class="font-bold mt-8 mb-4">${m.content||''}</h1></div>`;}else if(m.type==='titlebar'){let menuHtml='';if(m.menu&&m.menu.enabled){let links=m.menu.links.map(lk=>`<a href="${lk.url}" class="hover:opacity-75 transition font-semibold whitespace-nowrap" style="color: ${m.menu.textColor};">${lk.name}</a>`).join('');menuHtml=`<nav class="flex gap-6 mt-6 pt-4 border-t border-white/20 overflow-x-auto container mx-auto px-6">${links}</nav>`;}html+=`<div class="shadow-sm py-12 mb-8 w-full" style="background-color: ${m.color||'#FF69B4'};"><div class="container mx-auto px-6"><h1 style="font-family: '${m.font}'; color: ${m.titleColor}; font-size: ${m.titleSize}px;" class="font-bold mb-2">${m.title||''}</h1><p style="font-family: '${m.font}'; color: ${m.subtitleColor}; font-size: ${m.subtitleSize}px;">${m.subtitle||''}</p></div>${menuHtml}</div>`;}else if(m.type==='body'){html+=`<div class="container mx-auto px-6 max-w-4xl"><div style="font-family: '${m.font}'; color: ${m.textColor}; font-size: ${m.textSize}px;" class="leading-relaxed mb-6 whitespace-pre-wrap">${m.content||''}</div></div>`;}else if(m.type==='link'){html+=`<div class="container mx-auto px-6 max-w-4xl mb-6"><a href="${m.url||'#'}" class="inline-block px-6 py-3 rounded-xl font-bold shadow-md hover:opacity-90 transition" style="background-color: ${m.color||'#f72d55'}; color: ${m.textColor||'#ffffff'}; font-family: '${m.font}'; font-size: ${m.textSize}px;">${m.text||'Click Here'}</a></div>`;}else if(m.type==='image'){html+=`<div class="container mx-auto px-6 max-w-4xl"><img src="${m.url}" class="w-full h-auto rounded-xl shadow-lg my-8 object-cover"></div>`;}else if(m.type==='background'){if(m.bgType==='color'){b.style.backgroundColor=m.value;b.style.backgroundImage='none';}else if(m.bgType==='image'){b.style.backgroundImage=`url('${m.value}')`;b.style.backgroundSize='cover';b.style.backgroundAttachment='fixed';b.style.backgroundPosition='center';}}});}c.innerHTML=html;}).catch(e=>console.error(e));</script></body></html>

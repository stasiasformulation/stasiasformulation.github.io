<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title id="page-title">Products</title>
    <script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif; transition: background-color 0.3s;}#product-modal{transition:opacity 0.3s ease-in-out,visibility 0.3s ease-in-out;}</style>
</head><body id="body-bg" class="bg-gray-50" style="background-color: #f72d55;">
<header id="header-bg" class="shadow-sm" style="background-color: #FF69B4;"><div class="container mx-auto px-6 py-4"><h1 id="header-title" class="text-3xl font-bold text-white">Stasia's Formulation Skincare</h1><p id="header-subtitle" class="text-gray-100 mt-1">Discover our ingredients in our products.</p></div></header>
<main class="container mx-auto px-6 py-12"><div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-2 lg:grid-cols-3 gap-8"></div></main>
<div id="product-modal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 invisible opacity-0"><div id="modal-content" class="bg-white rounded-lg shadow-2xl w-full max-w-4xl h-[90vh] flex flex-col transform transition-transform duration-300 scale-95"><div class="flex justify-between items-center p-5 border-b border-gray-200 flex-shrink-0"><h2 id="modal-title" class="text-2xl font-semibold">Product Title</h2><button id="close-modal-btn" class="text-gray-500 hover:text-gray-800 text-3xl">&times;</button></div><div class="p-6 md:p-8 flex-grow overflow-y-auto"><div id="ingredients-view"><h3 class="text-xl font-semibold mb-6 text-gray-700">Key Ingredients</h3><div id="ingredients-grid" class="space-y-6"></div></div></div></div></div>
<script>document.addEventListener('DOMContentLoaded',()=>{const productGrid=document.getElementById('product-grid'),modal=document.getElementById('product-modal'),modalContent=document.getElementById('modal-content'),closeModalBtn=document.getElementById('close-modal-btn'),modalTitle=document.getElementById('modal-title'),ingredientsGrid=document.getElementById('ingredients-grid');let products=[];fetch('products.json').then(r=>r.json()).then(data=>{if(Array.isArray(data)){products=data;}else{products=data.items||[];if(data.settings){document.getElementById('body-bg').style.backgroundColor=data.settings.color2;document.getElementById('header-bg').style.backgroundColor=data.settings.color1;document.getElementById('header-title').textContent=data.settings.title;document.getElementById('page-title').textContent=data.settings.title;document.getElementById('header-subtitle').textContent=data.settings.subtitle;}}displayProducts();}).catch(e=>{productGrid.innerHTML='<p class="text-white">Failed to load products.</p>';});function displayProducts(){productGrid.innerHTML=products.map(p=>`<div class="product-card bg-white rounded-lg shadow-md overflow-hidden cursor-pointer transform hover:scale-105 transition-transform duration-300" data-id="${p.id}"><img src="${p.imageUrl}" alt="${p.name}" class="w-full aspect-square object-cover"><div class="p-4"><h3 class="text-lg font-semibold text-gray-800">${p.name}</h3></div></div>`).join('');}function showIngredients(id){const p=products.find(x=>x.id===id);if(!p)return;modalTitle.textContent=p.name;ingredientsGrid.innerHTML=p.ingredients.map(i=>`<div class="ingredient-item flex flex-col sm:flex-row items-start gap-4 p-4 border rounded-lg bg-gray-50"><img src="${i.imageUrl}" alt="${i.name}" class="w-full sm:w-24 h-auto sm:h-24 object-cover rounded-md flex-shrink-0"><div class="flex-grow"><h4 class="text-lg font-semibold text-gray-800">${i.name}</h4><p class="text-gray-600 mt-1">${i.description}</p></div></div>`).join('');modal.classList.remove('invisible','opacity-0');modalContent.classList.remove('scale-95');modalContent.classList.add('scale-100');}function closeModal(){modal.classList.add('opacity-0');modalContent.classList.add('scale-95');modalContent.classList.remove('scale-100');setTimeout(()=>modal.classList.add('invisible'),300);}productGrid.addEventListener('click',e=>{const c=e.target.closest('.product-card');if(c)showIngredients(parseInt(c.dataset.id,10));});closeModalBtn.addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});});</script></body></html>
